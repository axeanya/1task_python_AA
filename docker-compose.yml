services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d mydatabase" ]
      interval: 5s
      timeout: 5s
      retries: 5
  app:
    build: .
    volumes:
      - ./data:/app/data
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: python main.py
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/mydatabase
